<div class="page-wrapper">
  <div class="page-header">
    <div>
      <h1 class="page-title">Sales Team & Driver Roster</h1>
      <p class="page-subtitle">Role-based access management, assigned territories, and driver vehicle allocations</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" (click)="openCreateModal()">+ Add Team Member</button>
    </div>
  </div>

  <div class="glass-card">
    <div class="data-table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role Designation</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td><strong>{{ user.name }}</strong></td>
            <td>{{ user.email }}</td>
            <td>{{ user.phone || 'N/A' }}</td>
            <td>
              <span
                class="badge"
                [ngClass]="{
                  'badge-high': user.role_code === 'DIRECTOR',
                  'badge-medium': user.role_code === 'SALES_MANAGER',
                  'badge-cyan': user.role_code === 'SALES_REP',
                  'badge-success': user.role_code === 'DRIVER'
                }"
              >
                {{ user.role_code }}
              </span>
            </td>
            <td>
              <span class="status-dot green"></span> Active
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Create Member Modal -->
  <div *ngIf="showModal" class="modal-backdrop">
    <div class="modal-card glass-card">
      <div class="modal-header">
        <h3 class="modal-title">Add New Team Member</h3>
        <button class="close-btn" (click)="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" [(ngModel)]="newUser.name" placeholder="Name" />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="newUser.email" placeholder="name@contechcrm.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" [(ngModel)]="newUser.phone" placeholder="+91 ..." />
        </div>
        <div class="form-group">
          <label class="form-label">Role</label>
          <select class="form-control" [(ngModel)]="newUser.role_id">
            <option [ngValue]="1">Managing Director / CXO</option>
            <option [ngValue]="2">Sales Manager</option>
            <option [ngValue]="3">Sales Representative</option>
            <option [ngValue]="4">Logistics Coordinator</option>
            <option [ngValue]="5">Company Driver</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        <button class="btn btn-primary" (click)="createUser()">Save Member</button>
      </div>
    </div>
  </div>
</div>
