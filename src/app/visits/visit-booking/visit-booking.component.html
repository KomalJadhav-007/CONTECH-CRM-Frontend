<div class="page-wrapper">
  <div class="page-header">
    <div>
      <h1 class="page-title">Schedule Site Visit & Cab Pickup</h1>
      <p class="page-subtitle">Capacity-enforced time slots with real-time driver allocation and automatic 4-way verification trigger</p>
    </div>
    <div class="header-actions">
      <a routerLink="/visits" class="btn btn-secondary">&larr; Back to Hub</a>
    </div>
  </div>

  <div class="form-container">
    <div class="glass-card">
      <form (ngSubmit)="onSubmit()">
        <div *ngIf="errorMessage" class="error-alert">
          {{ errorMessage }}
        </div>

        <div class="form-section-title">1. Buyer & Project Selection</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Select Registered Buyer</label>
            <select class="form-control" [(ngModel)]="bookingData.buyer_id" name="buyer_id">
              <option *ngFor="let b of buyers" [ngValue]="b.id">
                {{ b.full_name }} ({{ b.phone }}) — {{ b.preferred_bhk }}
              </option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Destination Property Experience Centre</label>
            <select class="form-control" [(ngModel)]="bookingData.project_id" name="project_id">
              <option [ngValue]="1">Contech Crown Heights (Whitefield)</option>
              <option [ngValue]="2">Contech Skyline Elegance (Indiranagar)</option>
              <option [ngValue]="3">Contech Greenfield Sanctuary (Sarjapur)</option>
            </select>
          </div>
        </div>

        <div class="form-section-title" style="margin-top: 1.5rem;">2. Date, Time Slot & Capacity Check</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Visit Date</label>
            <input type="date" class="form-control" [(ngModel)]="bookingData.scheduled_date" name="scheduled_date" required />
          </div>

          <div class="form-group">
            <label class="form-label">Available Time Slot</label>
            <select class="form-control" [(ngModel)]="bookingData.time_slot" name="time_slot">
              <option value="09:30 AM - 11:00 AM">09:30 AM - 11:00 AM (Morning Slot)</option>
              <option value="11:00 AM - 12:30 PM">11:00 AM - 12:30 PM (Peak Slot)</option>
              <option value="02:00 PM - 03:30 PM">02:00 PM - 03:30 PM (Afternoon Slot)</option>
              <option value="04:00 PM - 05:30 PM">04:00 PM - 05:30 PM (Evening Sunset Slot)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Assigned Sales Executive</label>
            <select class="form-control" [(ngModel)]="bookingData.sales_rep_id" name="sales_rep_id">
              <option [ngValue]="3">Amit Verma (Senior Sales Rep)</option>
              <option [ngValue]="2">Priya Nair (Sales Manager)</option>
            </select>
          </div>
        </div>

        <div class="form-section-title" style="margin-top: 1.5rem;">3. Luxury Cab Pickup Logistics</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Cab Pickup Required?</label>
            <select class="form-control" [(ngModel)]="bookingData.cab_required" name="cab_required">
              <option [ngValue]="true">Yes, Dispatch Company Vehicle</option>
              <option [ngValue]="false">No, Buyer Will Drive Directly</option>
            </select>
          </div>

          <div class="form-group" *ngIf="bookingData.cab_required">
            <label class="form-label">Assigned Company Driver</label>
            <select class="form-control" [(ngModel)]="bookingData.driver_id" name="driver_id">
              <option [ngValue]="5">Ramesh Gowda (Toyota Innova Crysta - KA-01-MJ-8822)</option>
            </select>
          </div>
        </div>

        <div class="form-group" *ngIf="bookingData.cab_required">
          <label class="form-label">Buyer Pickup Address</label>
          <input type="text" class="form-control" [(ngModel)]="bookingData.pickup_address" name="pickup_address" placeholder="Complete address for driver GPS navigation" />
        </div>

        <div class="form-group">
          <label class="form-label">Special Visit Notes</label>
          <textarea class="form-control" rows="2" [(ngModel)]="bookingData.notes" name="notes"></textarea>
        </div>

        <div class="form-actions">
          <a routerLink="/visits" class="btn btn-secondary">Cancel</a>
          <button type="submit" [disabled]="loading" class="btn btn-primary">
            <span *ngIf="!loading">Confirm Booking & Trigger 4-Way Verification &rarr;</span>
            <span *ngIf="loading">Scheduling...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
