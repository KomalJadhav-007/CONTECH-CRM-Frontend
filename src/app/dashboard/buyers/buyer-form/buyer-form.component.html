<div class="page-wrapper">
  <div class="page-header">
    <div>
      <h1 class="page-title">Register New Buyer Profile</h1>
      <p class="page-subtitle">Enquiry intake with automated readiness scoring & next best step recommendation</p>
    </div>
    <div class="header-actions">
      <a routerLink="/buyers" class="btn btn-secondary">&larr; Back to Directory</a>
    </div>
  </div>

  <div class="form-container">
    <div class="glass-card">
      <form (ngSubmit)="onSubmit()">
        <div *ngIf="errorMessage" class="error-alert">
          {{ errorMessage }}
        </div>

        <div class="form-section-title">1. Contact & Demographic Details</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input type="text" class="form-control" [(ngModel)]="buyerData.full_name" name="full_name" placeholder="e.g. Rahul Sharma" required />
          </div>

          <div class="form-group">
            <label class="form-label">Phone Number *</label>
            <input type="text" class="form-control" [(ngModel)]="buyerData.phone" name="phone" placeholder="+91 98800 12345" required />
          </div>

          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" [(ngModel)]="buyerData.email" name="email" placeholder="rahul@example.com" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Current Residence / Locality</label>
            <input type="text" class="form-control" [(ngModel)]="buyerData.current_residence" name="current_residence" placeholder="e.g. Indiranagar, Bengaluru" />
          </div>

          <div class="form-group">
            <label class="form-label">Workplace Location / Tech Park</label>
            <input type="text" class="form-control" [(ngModel)]="buyerData.workplace_location" name="workplace_location" placeholder="e.g. Manyata Embassy Business Park" />
          </div>

          <div class="form-group">
            <label class="form-label">Family Size</label>
            <input type="number" class="form-control" [(ngModel)]="buyerData.family_size" name="family_size" min="1" max="10" />
          </div>
        </div>

        <div class="form-section-title" style="margin-top: 1.5rem;">2. Buying Intent & Configuration Preferences</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Min Budget (₹ Lacs)</label>
            <input type="number" class="form-control" [(ngModel)]="buyerData.budget_min_lacs" name="budget_min_lacs" />
          </div>

          <div class="form-group">
            <label class="form-label">Max Budget (₹ Lacs)</label>
            <input type="number" class="form-control" [(ngModel)]="buyerData.budget_max_lacs" name="budget_max_lacs" />
          </div>

          <div class="form-group">
            <label class="form-label">Preferred Unit Configuration</label>
            <select class="form-control" [(ngModel)]="buyerData.preferred_bhk" name="preferred_bhk">
              <option value="2 BHK">2 BHK</option>
              <option value="2.5 BHK">2.5 BHK</option>
              <option value="3 BHK">3 BHK</option>
              <option value="3.5 BHK">3.5 BHK Luxury</option>
              <option value="4 BHK">4 BHK Penthouse</option>
              <option value="Villa">Exclusive Villa</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label">Buying Timeframe</label>
            <select class="form-control" [(ngModel)]="buyerData.buying_timeframe" name="buying_timeframe">
              <option value="<30 days">&lt; 30 Days (Immediate Closing)</option>
              <option value="1-3 months">1 - 3 Months</option>
              <option value="3-6 months">3 - 6 Months</option>
              <option value=">6 months">&gt; 6 Months</option>
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-top: 1rem;">
          <label class="form-label">Initial Requirements & Discovery Notes</label>
          <textarea class="form-control" rows="3" [(ngModel)]="buyerData.notes" name="notes" placeholder="Notes on specific floor preferences, Vaastu requirements, balcony sizes, or special payment milestones..."></textarea>
        </div>

        <div class="form-actions">
          <a routerLink="/buyers" class="btn btn-secondary">Cancel</a>
          <button type="submit" [disabled]="loading" class="btn btn-primary">
            <span *ngIf="!loading">Save & Calculate Readiness Score &rarr;</span>
            <span *ngIf="loading">Saving Profile...</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
