<div class="login-page-container">
  <div class="login-card glass-card">
    <div class="brand-header">
      <div class="logo-mark">Contech CRM</div>
      <h1 class="portal-title">Revenue Guardian & Site Visit Platform</h1>
      <p class="portal-tagline">Real Estate Digital Command Center</p>
    </div>

    <!-- Quick Role Tester -->
    <div class="role-selector-container">
      <span class="selector-title">Select Demo Account:</span>
      <div class="role-buttons">
        <button type="button" class="role-chip" (click)="quickLogin('director')">Director</button>
        <button type="button" class="role-chip" (click)="quickLogin('manager')">Manager</button>
        <button type="button" class="role-chip" (click)="quickLogin('rep')">Sales Rep</button>
        <button type="button" class="role-chip" (click)="quickLogin('driver')">Driver</button>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div *ngIf="errorMessage" class="error-alert">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          class="form-control"
          placeholder="name@contechcrm.com"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          class="form-control"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="btn btn-primary btn-block submit-btn"
      >
        <span *ngIf="!loading">Secure Sign In &rarr;</span>
        <span *ngIf="loading">Authenticating...</span>
      </button>
    </form>
  </div>
</div>
